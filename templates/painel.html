<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Conformidade</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; background: #f5f5f5; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #333; color: white; }
        .conforme { background: #d4edda; color: #155724; padding: 4px 10px; border-radius: 4px; }
        .atencao { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 4px; }
        .nao-conforme { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🛡️ Painel de Conformidade</h1>
    <table>
        <tr>
            <th>Controle</th>
            <th>Categoria</th>
            <th>Status</th>
        </tr>
        {% for controle in controles %}
        <tr>
            <td>{{ controle.nome }}</td>
            <td>{{ controle.categoria }}</td>
            <td>
                {% if controle.status == "conforme" %}
                    <span class="conforme">✅ Conforme</span>
                {% elif controle.status == "atenção" %}
                    <span class="atencao">⚠️ Atenção</span>
                {% else %}
                    <span class="nao-conforme">❌ Não Conforme</span>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
